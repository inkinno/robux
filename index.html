<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Line &amp; Cell Studio - 분할선 &amp; 면 채움 스튜디오</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="canvas-container">
    <div id="canvas-stage">
      <canvas id="artCanvas"></canvas>
    </div>
  </div>

  <aside id="ui-panel">
    <div class="header">
      <h1>Line &amp; Cell Art Studio</h1>
      <span class="badge-4k" id="res-badge">4K UHD</span>
    </div>

    <!-- 모드 선택 탭 -->
    <div class="mode-tabs">
      <button id="tab-mode-line" class="tab-btn active">✏️ 1. 선 긋기 (Lines)</button>
      <button id="tab-mode-fill" class="tab-btn">🎨 2. 면 채우기 (Fills)</button>
    </div>

    <!-- 1단계: 선 긋기 도구 패널 -->
    <div id="panel-line-tools" class="section">
      <div class="section-title">
        <span>선(테이프) 두께 설정</span>
        <span id="line-width-label" style="color:var(--accent);">18px</span>
      </div>
      <input type="range" id="line-width-slider" min="2" max="60" value="18" />

      <div class="section-title" style="margin-top: 10px;">
        <span>랜덤 선 개수</span>
        <span id="line-count-label" style="color:var(--accent);">8개</span>
      </div>
      <input type="range" id="line-count-slider" min="3" max="20" value="8" />

      <div class="row-flex" style="margin-top: 8px;">
        <span style="font-size:0.75rem; color:var(--text-sub);">선 색상:</span>
        <input type="color" id="line-color-picker" value="#1e293b" style="width:40px; height:26px; border:none; cursor:pointer;" />
      </div>

      <div class="btn-group" style="margin-top: 12px;">
        <button class="primary" id="btn-random-lines">🎲 랜덤 선 긋기</button>
        <button id="btn-undo-line">↩️ 직전 선 취소</button>
      </div>
      <div class="btn-group" style="margin-top: 6px;">
        <button id="btn-clear-lines" style="width:100%;">🗑️ 선 전체 지우기</button>
      </div>
      <div class="tip-box">
        💡 <b>팁</b>: 캔버스 위에서 마우스를 드래그하면 수동으로 선을 그을 수도 있습니다!
      </div>
    </div>

    <!-- 2단계: 면 채우기 도구 패널 -->
    <div id="panel-fill-tools" class="section" style="display: none;">
      <div class="section-title">
        <span>면 채움 방식 (Fill Style)</span>
      </div>
      <select id="fill-type-select">
        <option value="gradient" selected>🌈 부드러운 그라데이션 (Gradient)</option>
        <option value="solid">🎨 단색 페인트통 (Solid Paint)</option>
        <option value="continuous">🖌️ 완전 연속 붓질 (Continuous Stroke)</option>
        <option value="pointillism">✨ 정돈된 고밀도 점묘화 (Pointillism)</option>
      </select>

      <div class="section-title" style="margin-top: 10px;">
        <span>브러시 이어짐 정도 (Continuity)</span>
        <span id="continuity-label" style="color:var(--accent);">85%</span>
      </div>
      <input type="range" id="continuity-slider" min="0" max="100" value="85" />

      <div class="section-title" style="margin-top: 10px;">
        <span>컬러 팔레트</span>
      </div>
      <div class="palette-row">
        <div class="color-slot"><input type="color" id="col0" value="#090a10"></div>
        <div class="color-slot"><input type="color" id="col1" value="#6366f1"></div>
        <div class="color-slot"><input type="color" id="col2" value="#ec4899"></div>
        <div class="color-slot"><input type="color" id="col3" value="#14b8a6"></div>
        <div class="color-slot"><input type="color" id="col4" value="#f8fafc"></div>
      </div>
      <select id="palette-preset">
        <option value="cyber">네온 사이버펑크 (Cyberpunk)</option>
        <option value="coral">산호와 풍화 (Coral Weathering)</option>
        <option value="ink">수묵과 금박 (Oriental Ink &amp; Gold)</option>
        <option value="forest">심해와 발광 포자 (Bioluminescence)</option>
        <option value="gallery" selected>클래식 유화 아틀리에 (Classic Atelier)</option>
        <option value="monolith">모노리스 미니멀 (Monochrome)</option>
      </select>

      <div class="row-flex" style="margin-top: 10px; justify-content: flex-start; gap: 8px;">
        <input type="checkbox" id="chk-auto-hide" style="cursor:pointer;" />
        <label for="chk-auto-hide" style="font-size:0.8rem; cursor:pointer;">패널 숨기고 2초 후 자동 시작</label>
      </div>

      <div class="btn-group" style="margin-top: 12px;">
        <button class="primary" id="btn-auto-fill">✨ 전체 자동 채우기</button>
        <button id="btn-undo-fill">↩️ 직전 채움 취소</button>
      </div>
      <div class="btn-group" style="margin-top: 6px;">
        <button id="btn-clear-fill" style="width:100%;">🧹 채움 초기화</button>
      </div>
      <div class="tip-box">
        💡 <b>팁</b>: 원하는 칸을 직접 클릭하면 해당 칸에만 페인트가 칠해집니다!
      </div>
    </div>

    <!-- 진행 상태 표시 바 -->
    <div class="progress-wrap"><div id="progress-bar"></div></div>
    <div class="status-bar">
      <span id="status-text">준비 완료</span>
      <span id="step-counter">0%</span>
    </div>

    <!-- 공통 버튼 영역 -->
    <div class="btn-group" style="margin-top: 12px;">
      <select id="resolution-select" style="margin-bottom:0;">
        <option value="4k" selected>4K UHD (3840×2160)</option>
        <option value="wqhd">WQHD (2560×1440)</option>
        <option value="fhd">FHD (1920×1080)</option>
      </select>
      <button id="btn-save">💾 PNG 저장</button>
    </div>
    <div class="btn-group" style="margin-top: 6px;">
      <button id="btn-record" style="width:100%;">🎥 화면 녹화 시작 (.webm)</button>
    </div>
  </aside>

  <div id="floating-controls">
    <button id="btn-toggle-ui">패널 숨기기 (H)</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/color-utils.js"></script>
  <script src="js/canvas-setup.js"></script>
  <script src="js/line-canvas.js"></script>
  <script src="js/region-detector.js"></script>
  <script src="js/fill-engine.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
